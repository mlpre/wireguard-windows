name: Build WireGuard

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout My Repository Source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build
        run: .\build.bat
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bin
          path: amd64
